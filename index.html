<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Versuri Trap - Ziua 3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0e;
            color: #f0f0f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #15151c;
            border: 2px solid #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ff0055;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #8888a0;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .output-box {
            background: #0f0f13;
            border: 1px solid #2a2a38;
            border-radius: 8px;
            padding: 20px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-line;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #ff0055;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }
        button:hover {
            background: #e0004c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
        }
        button.secondary {
            background: #2a2a38;
            color: #f0f0f5;
            box-shadow: none;
        }
        button.secondary:hover {
            background: #38384a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎤 Generator Trap / Rap</h1>
        <div class="subtitle">Ziua 3 — Proiect Portabil pe Stick</div>
        
        <div class="output-box" id="lyricOutput">
            Apasă pe un buton de mai jos ca să pornească beat-ul și să curgă versurile...
        </div>

        <div class="btn-group">
            <button onclick="genereazaStrofa()">Generează Strofă</button>
            <button class="secondary" onclick="genereazaRefren()">Bagă Refrenul</button>
        </div>
    </div>

    <script>
        const subiecte = [
            "Frații mei", "Ghetto-ul", "Orașul ăsta", "Eu cu ai mei", 
            "Timpul", "Banii", "Vibe-ul", "Lumina de la ecran", "Mintea mea"
        ];

        const verbe = [
            "numără", "construiesc", "ard", "sfidează", "caută", 
            "ocolesc", "schimbă", "atacă", "respiră"
        ];

        const complemente = [
            "fără să se uite în urmă", "pe repeat în boxe", "când toți alții dorm",
            "sub ochelari de soare noaptea", "fără milă pentru falsi", "în timp ce orașul doarme",
            "pe un beat de 808 curat"
        ];

        const strofePrestabilite = [
            "Nopți târzii la ecran, lumina bate-n tavan,\nȘtiu de unde am plecat, nu uit de unde vin, man.",
            "Banii vin, banii pleacă, da' caracterul rămâne,\nFac o mutare acum pentru ce vine mâine.",
            "Telefonul e pe silențios, nu deranja,\nSuntem pe cont propriu, nimeni nu ne poate da.",
            "Trag o gură de aer, privesc spre viitor,\nTot ce am făcut până acum a fost pe cont propriu, cu dor."
        ];

        const adverbeMod = [
            "pe silențios", "fără milă", "la limită", "pe mod avion", "fără regrete", "la dublu"
        ];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function genereazaStrofa() {
            let versuri = [];
            for (let i = 0; i < 4; i++) {
                let v = `${getRandomItem(subiecte)} ${getRandomItem(verbe)} ${getRandomItem(complemente)}`;
                versuri.push(v);
            }
            document.getElementById("lyricOutput").innerHTML = "--- STROFĂ NOUĂ ---\n\n" + versuri.join("\n");
        }

        function genereazaRefren() {
            let p1 = getRandomItem(strofePrestabilite);
            let am = getRandomItem(adverbeMod);
            let refrenText = `=== REFREN ===\n\n${p1}\nTotul se întâmplă acum ${am}!\n${p1}`;
            document.getElementById("lyricOutput").innerHTML = refrenText;
        }
    </script>

</body>
</html>
